<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h1 class="fw-bold mb-1">
        Employee Management
      </h1>

      <p class="text-muted mb-0">
        Manage your organization employees
      </p>
    </div>

    <a
      routerLink="/employees/add"
      class="btn btn-primary"
    >
      <i class="bi bi-plus-lg"></i>
      Add Employee
    </a>

  </div>


  <div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

      <div class="row g-3">

        <div class="col-md-8">

          <label
            for="search"
            class="form-label fw-semibold"
          >
            Search
          </label>

          <input
            id="search"
            type="text"
            class="form-control"
            placeholder="Search employee by name..."
            (input)="onSearch($event)"
          />

        </div>


        <div class="col-md-4">

          <label
            for="department"
            class="form-label fw-semibold"
          >
            Department
          </label>

          <select
            id="department"
            class="form-select"
            (change)="onDepartmentChange($event)"
          >

            <option value="All">
              All Departments
            </option>

            @for (
              department of departments();
              track department.id
            ) {

              <option [value]="department.name">
                {{ department.name }}
              </option>

            }

          </select>

        </div>

      </div>

    </div>

  </div>


  @if (filteredEmployees().length === 0) {

    <div class="alert alert-info text-center">
      No employees found.
    </div>

  } @else {

    <div class="row g-4">

      @for (
        employee of filteredEmployees();
        track employee.id
      ) {

        <div class="col-md-6 col-lg-4">

          <app-employee-card
            [employee]="employee">
          </app-employee-card>

        </div>

      }

    </div>

  }

</div>
